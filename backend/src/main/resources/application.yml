spring:
  application:
    name: gestion-rh

  datasource:
    url: jdbc:postgresql://localhost:5432/sirh
    username: sirh_user
    password: sirh
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 11MB

server:
  port: 8080

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000
  storage:
    candidatures-dir: uploads/candidatures
  contracts:
    expiry-alert-cron: "0 0 8 * * *"